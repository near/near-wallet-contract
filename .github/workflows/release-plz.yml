name: Release-plz

on:
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.NEARPROTOCOL_CI_PR_ACCESS }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      # Pinned to the last version that installs release-plz with
      # taiki-e/install-action. Newer versions use cargo-binstall, which inherits
      # CARGO_BUILD_TARGET, misses the host binary for the WASM target, and falls
      # back to a source build that cannot produce a runnable release-plz binary.
      - name: Run release-plz
        uses: release-plz/action@5ab144c9d67d4346240190d0f95ed08668677928
        env:
          GITHUB_TOKEN: ${{ secrets.NEARPROTOCOL_CI_PR_ACCESS }}
          CARGO_BUILD_TARGET: wasm32-unknown-unknown
