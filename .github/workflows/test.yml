name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt
          rustup override set 1.93.0

      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Tests
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.93.0
      - name: Install cargo-near CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          shared-key: "linux-1.86-test"
          cache-all-crates: true
      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy
          rustup override set 1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          shared-key: "linux-1.86-clippy"
          cache-all-crates: true
      - name: Run clippy
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- --warn clippy::all --warn clippy::nursery

  build-check:
    name: Build Check (WASM)
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.93.0

      - name: Install cargo-near CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          shared-key: "linux-1.86-build"
          cache-all-crates: true

      - name: Build wallet-contract
        run: cargo near build non-reproducible-wasm --no-abi --manifest-path wallet-contract/Cargo.toml

      - name: Build address-registrar
        run: cargo near build non-reproducible-wasm --no-abi --manifest-path address-registrar/Cargo.toml
