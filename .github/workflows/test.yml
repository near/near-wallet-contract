  build-check:
    name: Build Check (WASM)
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install 1.86.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.86.0

      - name: Install cargo-near CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.19.0/cargo-near-installer.sh | sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          shared-key: "linux-1.86-build"
          cache-all-crates: true

      - name: Build wallet-contract
        run: cargo near build non-reproducible-wasm --no-abi --manifest-path wallet-contract/Cargo.toml

      - name: Build address-registrar
        run: cargo near build non-reproducible-wasm --no-abi --manifest-path address-registrar/Cargo.toml
