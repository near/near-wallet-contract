name: Deploy Global Wallet Contract

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable stable release tag (for example, v0.1.2)
        required: true
        type: string
      network:
        description: Network to deploy
        required: true
        type: choice
        options:
          - testnet
          - mainnet

permissions:
  contents: read
  attestations: read

concurrency:
  group: deploy-global-wallet-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    env:
      NETWORK: ${{ inputs.network }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      WASM: eth_wallet_contract_${{ inputs.network }}.wasm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.draft == false and .prerelease == false and .immutable == true')" == true ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "$(git rev-list -n 1 "$RELEASE_TAG")" origin/main

      - name: Install near CLI
        env:
          NEAR_CLI_VERSION: 0.30.1
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/near-cli-rs/releases/download/v$NEAR_CLI_VERSION/near-cli-rs-installer.sh" | sh
          [[ "$(near --version)" == "near-cli-rs $NEAR_CLI_VERSION" ]]

      - name: Download and verify artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_dir="$RUNNER_TEMP/global-contract"
          mkdir -p "$artifact_dir"
          gh release download "$RELEASE_TAG" --dir "$artifact_dir" \
            --pattern "$WASM" --pattern checksums.sha256
          (cd "$artifact_dir" && \
            awk -v wasm="$WASM" '$2 == wasm { print }' checksums.sha256 | sha256sum --check -)
          gh attestation verify "$artifact_dir/checksums.sha256" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$artifact_dir/$WASM" --repo "$GITHUB_REPOSITORY"

      - name: Deploy if needed
        env:
          SIGNER_ACCOUNT: ${{ vars.NEAR_SIGNER_ACCOUNT_ID }}
          SIGNER_KEYPAIR: ${{ secrets.NEAR_SIGNER_KEYPAIR }}
        run: |
          : "${SIGNER_ACCOUNT:?environment variable NEAR_SIGNER_ACCOUNT_ID is required}"
          : "${SIGNER_KEYPAIR:?environment secret NEAR_SIGNER_KEYPAIR is required}"

          key_file="$RUNNER_TEMP/near-signer-key.json"
          umask 077
          printf '%s' "$SIGNER_KEYPAIR" > "$key_file"
          trap 'rm -f "$key_file"' EXIT

          near contract deploy-as-global use-file "$RUNNER_TEMP/global-contract/$WASM" \
            as-global-hash "$SIGNER_ACCOUNT" network-config "$NETWORK" \
            sign-with-access-key-file "$key_file" send --wait-until final
