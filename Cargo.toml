[workspace.package]
authors = ["Aurora Labs <hello@aurora.dev>", "NEAR <hello@near.org>"]
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/near/near-wallet-contract"
repository = "https://github.com/near/near-wallet-contract"
license = "CC0-1.0"

[workspace.dependencies]
aurora-engine-transactions = { version = "1.1", default-features = false, features = ["contract"]}
base64 = "0.21"
ethabi = { version = "18", default-features = false }
hex = "0.4"
near-contract-standards = "5.24"
near-sdk = { version = "5.24" }
serde = { version = "1", features = ["derive"] }

# dev-dependencies
anyhow = "1"
aurora-engine-types = { version = "1.1", default-features = false }
near-crypto = "0.21"
near-gas = "0.2"
near-workspaces = "0.10"
rlp = { version = "0.5", default-features = false }
serde_json = "1"
sha3 = "0.10"
tokio = { version = "1", features = ["full"] }

[workspace]
resolver = "2"
members = [
    "address-registrar",
    "wallet-contract",
]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
