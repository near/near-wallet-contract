[workspace.package]
authors = ["Aurora Labs <hello@aurora.dev>", "NEAR <hello@near.org>"]
version = "0.1.1"
edition = "2024"
homepage = "https://github.com/near/near-wallet-contract"
repository = "https://github.com/near/near-wallet-contract"
license = "CC0-1.0"

[workspace.dependencies]
aurora-engine-transactions = { version = "1.4", default-features = false, features = ["contract"]}
aurora-engine-types = { version = "3", default-features = false }
base64 = "0.21"
ethabi = { version = "18", default-features = false }
hex = "0.4"
near-contract-standards = "5.29"
near-sdk = { version = "5.29" }
serde = { version = "1", features = ["derive"] }

# dev-dependencies
anyhow = "1"
near-crypto = "0.37"
near-gas = "0.3"
near-jsonrpc-primitives = "0.37"
near-primitives = "0.37"
near-workspaces = { version = "0.23", features = ["experimental"] }
rlp = { version = "0.6", default-features = false }
serde_json = "1"
sha3 = "0.10"
tokio = { version = "1", features = ["full"] }

[workspace]
resolver = "2"
members = [
    "address-registrar",
    "wallet-contract",
]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
